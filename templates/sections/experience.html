<!--
  experience.html — section partial for Work Experience (#2183).

  Field placeholders filled per entry:
    COMPANY          — employer name
    PERIOD           — date range
    ROLE             — job title
    BULLETS          — rendered <li> tags
    LOCATION_BLOCK    — conditional: ", {location}" appended inline after company when present; omitted when absent

  Role, company and location render on one line (role bold, company/location italic)
  to save vertical space, with the date range right-aligned on the same line.

  Template packs: edit tag names, class names, and field order freely inside the ENTRY zone.
-->
<!--ENTRY-->
<div class="job">
  <div class="job-header">
    <span class="job-title-line"><span class="job-role-inline">{{ROLE}}</span> - <span class="job-company-inline">{{COMPANY}}{{LOCATION_BLOCK}}</span></span>
    <span class="job-period">{{PERIOD}}</span>
  </div>
  <ul>
    {{BULLETS}}
  </ul>
</div>
<!--LOCATION_BLOCK-->, {{LOCATION}}<!--/LOCATION_BLOCK-->
<!--/ENTRY-->
